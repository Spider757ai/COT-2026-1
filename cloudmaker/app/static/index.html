<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudMaker</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1d2330; --muted:#6b7280; --line:#e3e6eb;
          --accent:#2f6fde; --ok:#1f9d55; --bad:#d64545; --warn:#c98a0b; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--text); }
  header { background:#1d2330; color:#fff; padding:14px 24px; display:flex; align-items:center; gap:24px; }
  header h1 { font-size:18px; margin:0; }
  .quota { display:flex; gap:18px; font-size:13px; }
  .bar { width:140px; height:8px; background:#3b4252; border-radius:4px; overflow:hidden; margin-top:3px; }
  .bar > div { height:100%; background:#4ade80; }
  main { max-width:1150px; margin:0 auto; padding:20px; display:grid; gap:18px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px 18px; }
  h2 { font-size:15px; margin:0 0 12px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  .st { font-weight:600; }
  .st.running { color:var(--ok); } .st.missing { color:var(--bad); } .st.shut { color:var(--muted); }
  button { border:1px solid var(--line); background:#fff; border-radius:6px; padding:4px 10px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.danger { color:var(--bad); }
  form { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px; margin-top:14px; }
  label { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--muted); }
  input, select, textarea { font:inherit; padding:5px 7px; border:1px solid var(--line); border-radius:6px; color:var(--text); }
  textarea { font-family:ui-monospace,monospace; font-size:12px; min-height:70px; }
  .wide { grid-column:1/-1; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  #toast { position:fixed; right:18px; bottom:18px; max-width:420px; padding:10px 14px; border-radius:8px;
           background:#1d2330; color:#fff; display:none; white-space:pre-wrap; }
  #toast.err { background:var(--bad); }
  .muted { color:var(--muted); }
  @media (max-width:850px) { .two { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>☁ CloudMaker</h1>
  <div class="quota">
    <div>vCPU: <span id="q-cpu">–</span><div class="bar"><div id="q-cpu-bar" style="width:0"></div></div></div>
    <div>RAM: <span id="q-ram">–</span><div class="bar"><div id="q-ram-bar" style="width:0"></div></div></div>
  </div>
</header>

<main>
  <section>
    <h2>Виртуальные машины</h2>
    <table>
      <thead><tr><th>Имя</th><th>Состояние</th><th>vCPU / RAM</th><th>Образ</th><th>Сеть</th><th>IP</th><th></th></tr></thead>
      <tbody id="vms"><tr><td colspan="7" class="muted">загрузка…</td></tr></tbody>
    </table>
    <form id="vm-form">
      <label>Имя<input name="name" required pattern="[a-z0-9][a-z0-9-]{0,30}" placeholder="web-1"></label>
      <label>Образ<select name="image" id="image-select" required></select></label>
      <label>vCPU<input name="vcpus" type="number" min="1" value="1"></label>
      <label>RAM, MiB<input name="ram_mb" type="number" min="128" step="128" value="1024"></label>
      <label>Диск, GiB<input name="disk_gb" type="number" min="1" value="10"></label>
      <label>Сеть<select name="network" id="net-select"></select></label>
      <label>Hostname<input name="hostname" placeholder="как имя"></label>
      <label>Пароль (необязательно)<input name="password" type="text"></label>
      <label class="wide">SSH-ключи (по одному в строке)<textarea name="ssh_keys" placeholder="ssh-ed25519 AAAA..."></textarea></label>
      <label class="wide">user_data (необязательно: #cloud-config или #!/bin/bash)<textarea name="user_data" placeholder="#!/bin/bash&#10;echo hello > /root/hello.txt"></textarea></label>
      <div><button class="primary" type="submit">Создать ВМ</button></div>
    </form>
  </section>

  <div class="two">
    <section>
      <h2>Образы</h2>
      <table>
        <thead><tr><th>Имя</th><th>Путь</th><th>Описание</th><th></th></tr></thead>
        <tbody id="images"></tbody>
      </table>
      <form id="image-form">
        <label>Имя<input name="name" required placeholder="ubuntu-24"></label>
        <label class="wide">Путь к файлу<input name="path" required placeholder="/var/lib/libvirt/images/cloudmaker/base/....img"></label>
        <label class="wide">Описание<input name="description"></label>
        <div><button class="primary" type="submit">Добавить образ</button></div>
      </form>
    </section>

    <section>
      <h2>Сети</h2>
      <table>
        <thead><tr><th>Имя</th><th>Режим</th><th>Подсеть / бридж</th><th>Активна</th><th></th></tr></thead>
        <tbody id="networks"></tbody>
      </table>
      <form id="net-form">
        <label>Имя<input name="name" required placeholder="test"></label>
        <label>Режим<select name="mode"><option value="nat">nat</option><option value="isolated">isolated</option><option value="bridge">bridge (в хостовую сеть)</option></select></label>
        <label>Подсеть (nat/isolated)<input name="subnet" placeholder="10.77.0.0/24"></label>
        <label>Бридж хоста (bridge)<input name="bridge" placeholder="br0"></label>
        <div><button class="primary" type="submit">Создать сеть</button></div>
      </form>
    </section>
  </div>
</main>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg, err) {
  const t = $("toast"); t.textContent = msg; t.className = err ? "err" : ""; t.style.display = "block";
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.style.display = "none", err ? 7000 : 3000);
}

async function api(method, url, body) {
  const r = await fetch(url, { method, headers: {"Content-Type": "application/json"},
                               body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

async function act(method, url, okMsg) {
  try { await api(method, url); toast(okMsg); refresh(); } catch (e) { toast(e.message, true); }
}

async function refresh() {
  try {
    const [vms, images, nets, q] = await Promise.all([
      api("GET", "/api/vms"), api("GET", "/api/images"), api("GET", "/api/networks"), api("GET", "/api/quota")]);

    $("q-cpu").textContent = `${q.vcpus.used} / ${q.vcpus.limit}`;
    $("q-ram").textContent = `${q.ram_mb.used} / ${q.ram_mb.limit} MiB`;
    $("q-cpu-bar").style.width = Math.min(100, 100 * q.vcpus.used / q.vcpus.limit) + "%";
    $("q-ram-bar").style.width = Math.min(100, 100 * q.ram_mb.used / q.ram_mb.limit) + "%";

    $("vms").innerHTML = vms.length ? vms.map(v => `
      <tr>
        <td><b>${esc(v.name)}</b><br><span class="muted">${esc(v.libvirt_name)}</span></td>
        <td class="st ${esc(v.state.split(" ")[0])}">${esc(v.state)}</td>
        <td>${esc(v.vcpus)} / ${esc(v.ram_mb)} MiB</td>
        <td>${esc(v.image)}</td>
        <td>${esc(v.network)}</td>
        <td>${v.ips.map(esc).join("<br>") || '<span class="muted">—</span>'}</td>
        <td style="white-space:nowrap">
          <button onclick="act('POST','/api/vms/${esc(v.name)}/start','Запускаю ${esc(v.name)}')">▶</button>
          <button onclick="act('POST','/api/vms/${esc(v.name)}/stop','Выключаю ${esc(v.name)}')" title="shutdown">⏻</button>
          <button onclick="act('POST','/api/vms/${esc(v.name)}/stop?force=1','Выключено')" title="выдернуть питание">⏹</button>
          <button class="danger" onclick="confirm('Удалить ${esc(v.name)}?') && act('DELETE','/api/vms/${esc(v.name)}','Удалено')">✕</button>
        </td>
      </tr>`).join("") : '<tr><td colspan="7" class="muted">ВМ пока нет</td></tr>';

    $("images").innerHTML = images.map(i => `
      <tr><td><b>${esc(i.name)}</b><br><span class="muted">${esc(i.format)}</span></td>
          <td style="word-break:break-all">${esc(i.path)}</td><td>${esc(i.description)}</td>
          <td><button class="danger" onclick="act('DELETE','/api/images/${esc(i.name)}','Образ убран из реестра')">✕</button></td></tr>`).join("")
      || '<tr><td colspan="4" class="muted">нет образов</td></tr>';

    $("networks").innerHTML = nets.map(n => `
      <tr><td><b>${esc(n.name)}</b>${n.managed ? "" : ' <span class="muted">(не наша)</span>'}</td>
          <td>${esc(n.mode)}</td><td>${esc(n.subnet || n.bridge || "")}</td><td>${n.active ? "да" : "нет"}</td>
          <td>${n.managed ? `<button class="danger" onclick="act('DELETE','/api/networks/${esc(n.name)}','Сеть удалена')">✕</button>` : ""}</td></tr>`).join("");

    const keep = (sel, opts) => { const v = sel.value; sel.innerHTML = opts; if (v) sel.value = v; };
    keep($("image-select"), images.map(i => `<option>${esc(i.name)}</option>`).join(""));
    keep($("net-select"), nets.filter(n => n.active).map(n => `<option value="${esc(n.name)}">${esc(n.name)}</option>`).join(""));
  } catch (e) {
    toast("Не удалось получить данные: " + e.message, true);
  }
}

function formJSON(form) {
  const o = {};
  for (const [k, v] of new FormData(form)) if (v !== "") o[k] = v;
  return o;
}

function bindForm(id, url, okMsg, transform) {
  $(id).addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const btn = ev.target.querySelector("button[type=submit]");
    btn.disabled = true;
    try {
      let body = formJSON(ev.target);
      if (transform) body = transform(body);
      await api("POST", url, body);
      toast(okMsg); ev.target.reset(); refresh();
    } catch (e) { toast(e.message, true); }
    btn.disabled = false;
  });
}

bindForm("vm-form", "/api/vms", "ВМ создана", b => {
  for (const k of ["vcpus", "ram_mb", "disk_gb"]) if (b[k]) b[k] = Number(b[k]);
  if (b.ssh_keys) b.ssh_keys = b.ssh_keys.split("\n").map(s => s.trim()).filter(Boolean);
  return b;
});
bindForm("image-form", "/api/images", "Образ зарегистрирован");
bindForm("net-form", "/api/networks", "Сеть создана", b => {
  if (b.mode === "bridge") delete b.subnet; else delete b.bridge;
  return b;
});

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
