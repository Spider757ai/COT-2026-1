services:
  cloudmaker:
    build: .
    image: cloudmaker:latest
    container_name: cloudmaker
    # host-сеть: API доступен на localhost:8080, и сервис видит бриджи хоста
    network_mode: host
    restart: unless-stopped
    environment:
      CM_PORT: "8080"
      CM_QUOTA_VCPUS: "${CM_QUOTA_VCPUS:-8}"
      CM_QUOTA_RAM_MB: "${CM_QUOTA_RAM_MB:-8192}"
    volumes:
      # сокет libvirt хоста: ВМ создаются на хосте и видны через virsh
      - /var/run/libvirt:/var/run/libvirt
      # диски и образы лежат по одинаковому пути в контейнере и на хосте,
      # потому что пути к ним попадают в XML ВМ, который читает libvirt на хосте
      - /var/lib/libvirt/images/cloudmaker:/var/lib/libvirt/images/cloudmaker
      # состояние сервиса (реестр образов, желаемое состояние ВМ)
      - ./data:/data
